<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinKaya - Catatan Keuangan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #059669, #0d9488);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.3);
    }
    .logo svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(to right, #34d399, #2dd4bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 14px; color: #94a3b8; max-width: 320px; line-height: 1.5; margin-bottom: 24px; }
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .footer { font-size: 11px; color: #64748b; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24">
      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </svg>
  </div>
  <h1>FinKaya Mobile</h1>
  <p>Menghubungkan ke server aplikasi keuangan...</p>
  <div class="loader"></div>
  <a href="http://192.168.1.19:3000" class="btn" id="connectBtn">Buka FinKaya</a>
  
  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 280px;">
    <input id="customIp" type="text" value="192.168.1.19:3000" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; text-align: center; font-size: 13px;" />
    <button onclick="connectCustom()" style="padding: 8px 16px; border-radius: 8px; border: none; background: #334155; color: white; font-size: 12px; cursor: pointer;">Ganti Alamat Server IP</button>
  </div>

  <div class="footer">
    Pastikan server lokal FinKaya aktif di komputer Anda<br>
    (port 3000 pada jaringan Wi-Fi yang sama)
  </div>

  <script>
    function connectCustom() {
      var ip = document.getElementById('customIp').value.trim();
      if (!ip.startsWith('http')) {
        ip = 'http://' + ip;
      }
      localStorage.setItem('finkaya_server_ip', ip);
      window.location.href = ip;
    }

    var savedIp = localStorage.getItem('finkaya_server_ip') || 'http://192.168.1.19:3000';
    document.getElementById('connectBtn').href = savedIp;
    
    setTimeout(function() {
      window.location.href = savedIp;
    }, 1500);
  </script>
</body>
</html>
